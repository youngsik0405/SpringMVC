<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BootEx04.html</title>
<link rel="stylesheet" type="text/css" href="css/main.css">

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.2/css/bootstrap.min.css" />

<script type="text/javascript" src="http://code.jquery.com/jquery.min.js"></script>
<script type="text/javascript" src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.2/js/bootstrap.min.js"></script>

<style type="text/css">
	
	#login
	{
		border: 1px solid #ccc;
		border-radius: 5px;
		width: 300px;
		padding: 15px;
		margin: 30px;
	}
	#login h3
	{
		margin: 0px;
		margin-bottom: 15px;
	}


</style>



</head>
<body>

<div>
	<h1>기본 폼 구성하기</h1>
	<hr>
</div>

<div id="login">
	
	<h3>로그인 <small>회원 인증하기</small></h3>

	<form>
		<!-- 『.form-group』 : 폼을 구성하는 항목들 중 관련 항목만 묶음 처리 -->
		<div class="form-group">
		<label for="txtId">아이디</label>
		<input type="text" id="txtId" class="form-control"
		placeholder="아이디를 입력하세요" required="required">
		</div>
		
		<!-- 『.form-group』 : 폼을 구성하는 항목들 중 관련 항목만 묶음 처리 -->
		<div class="form-group">
		<label for="txtPw">암호</label>
		<input type="text" id="txtPw" class="form-control"
		placeholder="패스워드를 입력하세요" required="required">
		</div>
	</form>
	
	<input type="submit" value="입력하기" class="btn btn-primary">


</div>


</body>
</html>
